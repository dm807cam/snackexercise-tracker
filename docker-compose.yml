services:
  app:
    build: .
    image: snackexercise-tracker
    container_name: snackexercise-tracker
    restart: unless-stopped
    ports:
      # Host port only. Override with APP_PORT if 3000 is taken.
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "file:/data/app.db"
      # The zone a new account starts in. Everyone can set their own in Settings.
      TZ: "${TZ:-Europe/Berlin}"
      # Optional: a voice-entry key for everyone without their own.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # All optional; .env.example says what each one is for. Empty means unset.
      APP_URL: "${APP_URL:-}"
      TRUST_PROXY: "${TRUST_PROXY:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      REGISTRATION: "${REGISTRATION:-}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      LOG_LEVEL: "${LOG_LEVEL:-}"
      SQLITE_JOURNAL_MODE: "${SQLITE_JOURNAL_MODE:-}"
    volumes:
      - snackexercise-data:/data
    healthcheck:
      # Ready, not just up: migrated, seeded, database reachable.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  snackexercise-data:
