services:
  app:
    build: .
    image: snackexercise-tracker
    container_name: snackexercise-tracker
    restart: unless-stopped
    ports:
      # Host port only. Override with APP_PORT if 3000 is taken.
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "file:/data/app.db"
      # Day boundaries follow this zone. Set it to yours.
      TZ: "${TZ:-Europe/Berlin}"
      # Optional: seeds the key on first run. You can also paste it in Settings.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    volumes:
      # Whole mount spec, not just the source, so it can be either the managed
      # volume below or a host path. The container always writes to /data.
      # A named volume other than the default must also be declared down there.
      - "${APP_VOLUMES:-snackexercise-data:/data}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  snackexercise-data:
